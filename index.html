<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tres en Raya</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:#111;
font-family:Arial;
color:white;
}

#board{
display:grid;
grid-template-columns:repeat(3,100px);
grid-template-rows:repeat(3,100px);
gap:5px;
}

.cell{
width:100px;
height:100px;
background:#333;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
cursor:pointer;
border-radius:10px;
}

.cell:hover{
background:#444;
}

#msg{
margin-top:20px;
font-size:20px;
}

button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>❌⭕ Tres en Raya</h1>

<div id="board"></div>

<div id="msg">Turno: X</div>

<button onclick="resetGame()">🔄 Reiniciar</button>

<script>

const board = document.getElementById("board");
const msg = document.getElementById("msg");

let currentPlayer = "X";
let cells = ["","","","","","","","",""];
let gameActive = true;

// crear tablero
function createBoard(){

board.innerHTML="";

cells.forEach((cell,index)=>{

const div=document.createElement("div");
div.classList.add("cell");
div.innerText=cell;

div.addEventListener("click",()=>handleMove(index));

board.appendChild(div);

});

}

function handleMove(index){

if(!gameActive) return;
if(cells[index] !== "") return;

cells[index] = currentPlayer;

if(checkWin()){
msg.innerText = "🎉 Ganó " + currentPlayer;
gameActive = false;
}else if(cells.every(c=>c!=="")){
msg.innerText = "🤝 Empate";
gameActive = false;
}else{
currentPlayer = currentPlayer === "X" ? "O" : "X";
msg.innerText = "Turno: " + currentPlayer;
}

createBoard();

}

function checkWin(){

const winPatterns = [
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

return winPatterns.some(pattern=>{
const [a,b,c] = pattern;
return cells[a] &&
cells[a] === cells[b] &&
cells[a] === cells[c];
});

}

function resetGame(){
cells = ["","","","","","","","",""];
currentPlayer = "X";
gameActive = true;
msg.innerText = "Turno: X";
createBoard();
}

createBoard();

</script>

</body>
</html>
